[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switchboard"
version = "0.1.0"
description = "Tool-using customer-service agent for a simulated broadband provider, with policy guardrails and an end-state evaluation suite."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# Dense help-centre retrieval: sentence-transformers embeddings in a Chroma collection.
# Optional so the base install and CI stay light; BM25 is the no-download baseline.
dense = ["sentence-transformers>=2.7", "chromadb>=0.5"]
# The tool-calling LLM agent. The deterministic workflow agent needs none of it.
llm = ["transformers>=4.44", "torch>=2.2", "accelerate>=0.30"]
# Intent router (experimental, see README).
router = ["scikit-learn>=1.3", "joblib>=1.3", "xgboost>=2.0", "datasets>=2.18"]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
switchboard = ["kb/*.json", "eval/*.jsonl", "eval/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is expected in tests

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
